<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Country</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(rgba(5, 9, 18, .63), rgba(5, 9, 18, .78)), url("earth-background.gif") center center / cover fixed, #080d18;
      color: #edf2ff;
      --muted: #9aa8c2;
      --line: rgba(172, 193, 228, .14);
      --panel: rgba(18, 27, 45, .9);
      --accent: #62e6c2;
    }
    * { box-sizing: border-box; }
    body {
      max-width: 760px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 64px 24px;
      background: transparent;
      color: #edf2ff;
    }
    h1 { margin: 0 0 28px; font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -.055em; }
    h1::after { content: "."; color: var(--accent); }
    .card { padding: 28px; border: 1px solid var(--line); border-radius: 18px; background: linear-gradient(145deg, rgba(24, 36, 59, .94), var(--panel)); box-shadow: 0 18px 50px rgba(0, 0, 0, .2); backdrop-filter: blur(14px); }
    label { display: inline-block; margin: 8px 0 2px; color: #cbd6e9; font-size: .93rem; font-weight: 600; }
    input, textarea { display: block; width: 100%; max-width: 480px; min-height: 46px; margin: 5px 0 12px; padding: 11px 14px; border: 1px solid rgba(172, 193, 228, .22); border-radius: 10px; background: #0b1322; color: #f4f7ff; font: inherit; outline: none; transition: border-color .18s, box-shadow .18s; }
    input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(98, 230, 194, .14); }
    textarea { min-height: 112px; resize: vertical; }
    button { min-height: 42px; margin: 8px 8px 0 0; padding: 10px 15px; border: 1px solid rgba(98, 230, 194, .32); border-radius: 10px; background: #102a2a; color: #9ff5df; font: inherit; font-weight: 650; cursor: pointer; transition: transform .16s, background .16s; }
    button:hover { transform: translateY(-1px); background: #173b39; }
    button[type="submit"] { background: var(--accent); color: #06221f; border-color: var(--accent); }
    button[type="submit"]:hover { background: #8cf2d6; }
    a { text-decoration: none; }
    button:focus-visible, a:focus-visible { outline: 3px solid rgba(98, 230, 194, .65); outline-offset: 3px; }
    button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .message { margin-top: 16px; color: var(--muted); line-height: 1.5; }
    .error { color: #ff8292; }
    .success { color: #79e8b2; }
    @media (max-width: 520px) { body { padding: 38px 16px; } .card { padding: 21px; } }
  </style>
</head>
<body>
  <h1>Edit Country</h1>
  <div class="card">
    <form id="editForm">
      <label for="country">Country</label><br>
      <input type="text" id="country" required><br>


      <button type="submit">Save Country</button>
      <a href="/"><button type="button">Cancel</button></a>
      <p id="message" class="message" aria-live="polite"></p>
    </form>
  </div>

  <script>
    const message = document.getElementById('message');
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    function showMessage(text, type = '') {
      message.textContent = text;
      message.className = `message ${type}`;
    }

    async function request(url, options = {}) {
      const response = await fetch(url, options);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || 'Request failed.');
      return data;
    }

    async function loadRecord() {
      if (!id) {
        showMessage('No country ID was provided.', 'error');
        document.querySelector('button[type="submit"]').disabled = true;
        return;
      }
      try {
        const item = await request(`/api/travel/${encodeURIComponent(id)}`);
        document.getElementById('country').value = item.country || '';
      } catch (error) {
        showMessage(`Could not load country: ${error.message}`, 'error');
        document.querySelector('button[type="submit"]').disabled = true;
      }
    }

    document.getElementById('editForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const country = document.getElementById('country').value.trim();

      try {
        await request(`/api/travel/${encodeURIComponent(id)}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ country })
        });
        showMessage('Changes saved. Returning to your bucket list...', 'success');
        window.location.href = '/';
      } catch (error) {
        showMessage(`Could not save country changes: ${error.message}`, 'error');
      }
    });

    loadRecord();
  </script>
</body>
</html>
